name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: 1
  FORCE_COLOR: 1

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (Python from .python-version)
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Sync project
        run: uv sync --locked

      - name: Ruff format
        run: uv run --no-sync ruff format --check --diff .

      - name: Ruff lint
        run: uv run --no-sync ruff check --output-format=github .

      - name: Pyrefly (fails on errors not in pyrefly-baseline.json)
        run: uv run --no-sync pyrefly check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (Python from .python-version)
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Sync project
        run: uv sync --locked

      - name: Pytest
        run: uv run --no-sync pytest -q -W error::DeprecationWarning

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          tags: sidequest-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
